name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run typecheck

      - name: 'Test: core'
        run: pnpm --filter "@media-scraper/core" test
      - name: 'Test: dedupe'
        run: pnpm --filter "@media-scraper/dedupe" test
      - name: 'Test: downloader'
        run: pnpm --filter "@media-scraper/downloader" test
      - name: 'Test: cli'
        run: pnpm --filter "@media-scraper/cli" test
      - name: 'Test: extension'
        run: pnpm --filter "@media-scraper/extension" test
