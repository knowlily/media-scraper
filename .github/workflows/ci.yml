name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run lint       || { echo "LINT FAILED"; exit 1; }
      - run: pnpm run typecheck  || { echo "TYPECHECK FAILED"; exit 1; }

      - run: pnpm --filter @media-scraper/core test
      - run: pnpm --filter @media-scraper/dedupe test
      - run: pnpm --filter @media-scraper/downloader test
      - run: pnpm --filter @media-scraper/cli test
      - run: pnpm --filter @media-scraper/extension test
