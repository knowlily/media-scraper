name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Install Playwright
        run: cd packages/mcp && pnpm exec playwright install chromium --with-deps

      - name: Test core
        run: pnpm --filter=@media-scraper/core test

      - name: Test dedupe
        run: pnpm --filter=@media-scraper/dedupe test

      - name: Test downloader
        run: pnpm --filter=@media-scraper/downloader test

      - name: Test cli
        run: pnpm --filter=@media-scraper/cli test

      - name: Test extension
        run: pnpm --filter=@media-scraper/extension test

      - name: Test browser
        run: pnpm --filter=@media-scraper/browser test

      - name: Test mcp
        run: pnpm --filter=@media-scraper/mcp test
